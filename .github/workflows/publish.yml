name: Мир после — публикация

on:
  workflow_dispatch:
  schedule:
    # 09:00 по Владивостоку (UTC+10), с понедельника по субботу
    - cron: "0 23 * * 0-5"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Подготовить текст публикации
        id: post
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get("EVENT_NAME") == "schedule":
              today = datetime.now(ZoneInfo("Asia/Vladivostok")).date().isoformat()
              path = Path(f"posts/queue/{today}.txt")
              if not path.exists():
                  raise SystemExit(f"На {today} публикация не подготовлена. Ничего не отправлено.")
          else:
              path = Path("posts/next.txt")

          text = path.read_text(encoding="utf-8").strip()
          if not text or text.startswith("#") or text.startswith("<!--"):
              raise SystemExit(f"{path} пуст или содержит шаблон")
          Path("/tmp/post.txt").write_text(text, encoding="utf-8")
          print(f"Подготовлен файл: {path}")
          PY

      - name: Опубликовать в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          channel = os.environ.get("TELEGRAM_CHANNEL_ID")
          text = Path("/tmp/post.txt").read_text(encoding="utf-8")

          if not token or not channel:
              raise SystemExit("Не заданы GitHub Secrets TELEGRAM_BOT_TOKEN и TELEGRAM_CHANNEL_ID")

          data = urllib.parse.urlencode({"chat_id": channel, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              result = response.read().decode("utf-8")
              print(result)
              if '"ok":true' not in result:
                  raise SystemExit("Telegram не подтвердил публикацию")
          PY
